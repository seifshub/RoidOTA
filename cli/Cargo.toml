[package]
name = "roidota"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Command-line client for the RoidOTA firmware update server"
license = "MIT"
repository = "https://github.com/seifshub/RoidOTA"

[[bin]]
name = "roidota"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
