; Example sketch for the RoidOTA library.
;
;   pio run -t upload      (first flash over USB; later updates go over the air)
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  ; The library lives in this repository; no copy is kept next to the example.
  symlink://../../lib/RoidOTA

build_flags =
  ; Unique per device: letters, digits, "_", "-" or "." (max 64 characters).
  -DDEVICE_ID=\"esp_1\"
  ; Address of the machine running the MQTT broker, and the broker credentials
  ; (MQTT_USERNAME / MQTT_PASSWORD in backend/.env). Do not commit real secrets.
  -DMQTT_SERVER=\"192.168.1.10\"
  -DMQTT_PORT=1883
  -DMQTT_USERNAME=\"roidota\"
  -DMQTT_PASSWORD=\"roidota\"
  -DHEARTBEAT_INTERVAL=30000
  -DCORE_DEBUG_LEVEL=3
